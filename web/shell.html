<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gotham Night – OpenGL Demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0D12; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* The program draws into a 750x1040 buffer; scale it to fit the window */
    canvas {
      display: block;
      height: 100vh;
      width: auto;
      max-width: 100vw;
      aspect-ratio: 750 / 1040;
      object-fit: contain;
      background: #0B0D12;
    }
    #status { position: absolute; color: #9AA1B2; font: 14px Arial, sans-serif; }
    #controls {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 8px; background: rgba(11, 13, 18, 0.8);
      color: #E8EAF0; font: 13px Arial, sans-serif; white-space: nowrap;
    }
    /* The build minifies this page and drops spaces between tags, so spacing is done in CSS */
    #controls { display: flex; gap: 14px; }
    #controls[hidden] { display: none; }
    #controls b { color: #F2C14E; margin-right: 5px; }
    @media (max-width: 600px) { #controls { flex-wrap: wrap; justify-content: center; gap: 4px 14px; width: calc(100% - 32px); white-space: normal; } }
    #sound {
      position: absolute; top: 12px; right: 12px; padding: 8px 14px; border: 0; border-radius: 8px;
      background: rgba(11, 13, 18, 0.8); color: #E8EAF0; font: 13px Arial, sans-serif; cursor: pointer;
    }
    #sound:hover { color: #F2C14E; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div id="controls" hidden>
    <span><b>B</b>Batman &amp; Bat-Signal</span>
    <span><b>S / A</b>stop / start blimp</span>
    <span><b>Z / X</b>reverse / forward</span>
    <span><b>Left / right click</b>faster / slower</span>
  </div>
  <button id="sound" hidden>♪ Music: off</button>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () { document.getElementById('status').remove(); }
    };
    // Controls and music only on the full page, not in small embedded previews
    if (window.self === window.top) {
      document.getElementById('controls').hidden = false;

      // Browsers only allow audio after the visitor interacts with the page,
      // so the music starts on the first click or key press
      var music = new Audio('music.mp3');
      music.loop = true;
      var soundButton = document.getElementById('sound');
      soundButton.hidden = false;
      var updateButton = function () { soundButton.textContent = music.paused ? '♪ Music: off' : '♪ Music: on'; };
      music.addEventListener('play', updateButton);
      music.addEventListener('pause', updateButton);
      var startMusic = function (event) {
        if (event.target === soundButton) return;
        window.removeEventListener('pointerdown', startMusic);
        window.removeEventListener('keydown', startMusic);
        music.play().catch(function () {});
      };
      window.addEventListener('pointerdown', startMusic);
      window.addEventListener('keydown', startMusic);
      soundButton.addEventListener('click', function () {
        window.removeEventListener('pointerdown', startMusic);
        window.removeEventListener('keydown', startMusic);
        if (music.paused) music.play().catch(function () {}); else music.pause();
      });
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
