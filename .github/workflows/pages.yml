# Builds main.cpp to WebAssembly with Emscripten and publishes it to GitHub Pages
name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build with Emscripten
        run: |
          mkdir -p dist
          emcc main.cpp -O2 -o dist/index.html \
            --shell-file web/shell.html \
            -sLEGACY_GL_EMULATION \
            -lglut -lGL -lGLU

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
